<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b0b"/>
<title>리프트노트</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0b0b;color:#f2efe8;font-family:sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100dvh}
.screen{display:none;padding:16px 16px 100px}.screen.on{display:block}
.logo{font-size:24px;margin:0}.logo small{display:block;font-size:11px;color:#8d8a84;letter-spacing:.24em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 8px}
.week span{text-align:center;font-size:11px;color:#8d8a84}
.week button{border:0;background:0;color:#fff;border-radius:12px;padding:8px 0}
.week button.on{background:#2a2a2a}
h1{font-size:22px;margin:4px 0 10px}h2{font-size:16px;margin:0}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin-top:10px}
.lead,.k{color:#8d8a84;font-size:13px}
.primary,.ghost,.mini,.blue{border:0;border-radius:14px;padding:12px;color:#efe8dc}
.primary,.ghost,.blue{width:100%;margin-top:8px}
.primary{background:#3a342c}.ghost{background:#1a1a1a}.blue{background:#2b6cb0}
.mini{background:#1a1a1a;padding:7px 10px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#0b0b0b;border-top:1px solid #222;display:flex;z-index:6}
.nav button{flex:1;background:0;border:0;color:#6f6c66;padding:12px 0;font-size:11px}
.nav button.on{color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.exbtn{border:1px solid #2a2a2a;background:#1a1a1a;color:#fff;border-radius:12px;padding:10px 12px}
.exbtn.on{background:#3a342c;border-color:#5a5044}
.msg{color:#c9b79a;font-size:13px;min-height:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal button{border:0;background:#1a1a1a;color:#fff;border-radius:8px;padding:10px 0}
.cal button.has{outline:1px solid #5a5044}
.statrow{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:#141414;border:1px solid #2a2a2a;border-radius:14px;padding:12px;text-align:center}
.tbl{width:100%;border-collapse:collapse;margin-top:8px}
.tbl th{font-size:12px;color:#8d8a84;font-weight:400;text-align:center;padding:4px}
.tbl td{padding:4px;text-align:center}
.tbl input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:#fff;padding:10px 6px;text-align:center}
.done{width:36px;height:36px;border-radius:10px;border:0;background:#2a2a2a;color:#fff}
.done.on{background:#2b6cb0}
.pickrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #222}
.pickrow input{width:20px;height:20px}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:8;padding:24px 16px 80px;overflow:auto}
.mask.on{display:block}
.mask .inner{max-width:480px;margin:0 auto;background:#141414;border-radius:16px;padding:14px}
.setbar{display:flex;justify-content:space-between;margin-top:8px}
.link{background:0;border:0;color:#8ab4f8;padding:8px 0}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vol{font-size:12px;color:#8d8a84;margin-top:4px}
</style>
</head>
<body>
<div class="app">
<section id="s-today" class="screen on">
<p class="logo">리프트노트<small>LIFTNOTE</small></p>
<div class="week" id="weekBar"></div>
<div class="k">오늘 세션</div>
<h1 id="todayTitle">날짜</h1>
<p class="lead" id="statusLine">종목을 넣고 세트 표를 채운 뒤 저장하면 그날 기록으로 남습니다.</p>
<div id="homeBox"></div>
<div id="sessionBox"></div>
<div id="savedBox"></div>
</section>
<section id="s-cal" class="screen">
<p class="logo">달력</p>
<div class="row2"><button class="ghost" type="button" id="btnPrev">이전</button>
<button class="ghost" type="button" id="btnNext">다음</button></div>
<h1 id="calTitle"></h1>
<div class="cal" id="calGrid"></div>
<div class="card" id="calDetail"><p class="lead">날짜를 누르면 그날 세션이 나옵니다.</p></div>
</section>
<section id="s-ability" class="screen">
<p class="logo">능력</p>
<p class="lead">자세 점수 없음. 볼륨·PR만.</p>
<div class="statrow">
<div class="stat"><b id="abVol">0</b><div class="k">볼륨</div></div>
<div class="stat"><b id="abPr">0</b><div class="k">PR</div></div>
</div>
<div class="card" id="rmBox"></div>
</section>
<section id="s-form" class="screen">
<p class="logo">자세</p>
<p class="lead">종목 고르고 사진·영상. 연습 리포트. 점수 없음.</p>
<div class="card"><p id="formPicked">운동을 고르세요</p><div id="exList" class="grid"></div></div>
<label class="card">사진/영상<input id="file" type="file" accept="image/*,video/*"></label>
<p class="msg" id="fileMeta"></p>
<button class="primary" type="button" id="btnReport">연습 리포트</button>
<div class="card" id="reportBox" style="display:none"></div>
</section>
<section id="s-settings" class="screen">
<p class="logo">설정</p>
<div class="card"><p class="lead">일기 공짜. 자세는 연습. KEEP By soon young.</p>
<button class="ghost" type="button" id="btnClear">기록 지우기</button></div>
</section>
<nav class="nav">
<button type="button" data-go="today" class="on">오늘</button>
<button type="button" data-go="cal">달력</button>
<button type="button" data-go="ability">능력</button>
<button type="button" data-go="form">자세</button>
<button type="button" data-go="settings">설정</button>
</nav>
</div>
<div class="mask" id="pickMask">
<div class="inner">
<p class="k">종목 고르기</p>
<div id="pickList"></div>
<button class="blue" type="button" id="btnPickAdd">선택한 운동 추가</button>
<button class="ghost" type="button" id="btnPickClose">닫기</button>
</div>
</div>
<script>
(function(){
try{
var EX=["바벨 벤치프레스","인클라인 벤치프레스","랫풀다운","바벨 로우","밀리터리 프레스","레터럴 레이즈","바벨 컬","리버스 바벨 컬","스쿼트","데드리프트"];
function $(i){return document.getElementById(i)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function safeDel(k){try{localStorage.removeItem(k)}catch(e){}}
function load(){try{return JSON.parse(safeGet("ln_diary")||"[]")}catch(e){return[]}}
function saveAll(a){safeSet("ln_diary",JSON.stringify(a))}
function draftKey(){return "ln_draft_"+today()}
function loadDraft(){try{return JSON.parse(safeGet(draftKey())||"[]")}catch(e){return[]}}
function saveDraft(){safeSet(draftKey(),JSON.stringify(draft))}
function clone(x){return JSON.parse(JSON.stringify(x))}
var formPicked=EX[0];
var draft=loadDraft();
var pickSel={};
function daySaved(){
  var list=load();
  for(var i=0;i<list.length;i++)if(list[i].date===today())return list[i];
  return null;
}
function lastSets(name){
  var list=load();
  for(var i=0;i<list.length;i++){
    var items=list[i].items||[];
    for(var j=0;j<items.length;j++)if(items[j].name===name&&items[j].sets&&items[j].sets.length)return items[j].sets;
  }
  return [{w:20,r:10,done:false},{w:20,r:10,done:false},{w:20,r:10,done:false}];
}
function noteOf(items){
  return items.map(function(it){
    var s=(it.sets||[]).map(function(x){return x.w+"kg × "+x.r+"회";}).join(", ");
    return it.name+" · "+s;
  }).join("\n");
}
function volOf(it){
  var v=0;var sets=it.sets||[];
  for(var i=0;i<sets.length;i++)v+=(Number(sets[i].w)||0)*(Number(sets[i].r)||0);
  return v;
}
function go(n){
  var screens=document.querySelectorAll(".screen");
  for(var i=0;i<screens.length;i++)screens[i].classList.remove("on");
  $("s-"+n).classList.add("on");
  var navs=document.querySelectorAll(".nav button");
  for(var j=0;j<navs.length;j++)navs[j].classList.toggle("on",navs[j].getAttribute("data-go")===n);
  if(n==="today"){draft=loadDraft();paintToday();}
  if(n==="cal")paintCal();
  if(n==="ability")paintAb();
}
var navs=document.querySelectorAll(".nav button");
for(var ni=0;ni<navs.length;ni++)(function(b){b.onclick=function(){go(b.getAttribute("data-go"));};})(navs[ni]);
(function(){
  var d=["일","월","화","수","목","금","토"],n=new Date(),s=new Date(n);
  s.setDate(n.getDate()-n.getDay());
  var h="";
  for(var i=0;i<7;i++)h+="<span>"+d[i]+"</span>";
  for(var i=0;i<7;i++){
    var x=new Date(s);x.setDate(s.getDate()+i);
    h+="<button type='button' class='"+(x.toDateString()===n.toDateString()?"on":"")+"'>"+x.getDate()+"</button>";
  }
  $("weekBar").innerHTML=h;
  $("todayTitle").textContent=(n.getMonth()+1)+"월 "+n.getDate()+"일 "+d[n.getDay()]+"요일";
})();
function openPick(){
  pickSel={};
  var box=$("pickList");
  box.innerHTML="";
  for(var i=0;i<EX.length;i++){
    var already=false;
    for(var j=0;j<draft.length;j++)if(draft[j].name===EX[i])already=true;
    var row=document.createElement("label");
    row.className="pickrow";
    var cb=document.createElement("input");
    cb.type="checkbox";
    cb.disabled=already;
    cb.onchange=(function(name){return function(){pickSel[name]=this.checked;};})(EX[i]);
    var tx=document.createElement("span");
    tx.textContent=EX[i]+(already?" (이미 넣음)":"");
    row.appendChild(cb);row.appendChild(tx);box.appendChild(row);
  }
  $("pickMask").classList.add("on");
}
function addPicked(){
  var n=0;
  for(var i=0;i<EX.length;i++){
    if(!pickSel[EX[i]])continue;
    var exists=false;
    for(var j=0;j<draft.length;j++)if(draft[j].name===EX[i])exists=true;
    if(exists)continue;
    var prev=lastSets(EX[i]).map(function(s){return {w:s.w,r:s.r,done:false};});
    draft.push({name:EX[i],sets:prev});
    n++;
  }
  saveDraft();
  $("pickMask").classList.remove("on");
  paintToday();
  $("statusLine").textContent=n?n+"개 종목을 넣었습니다. 숫자를 고치고 완료를 누르세요.":"고른 종목이 없습니다.";
}
$("btnPickAdd").onclick=addPicked;
$("btnPickClose").onclick=function(){$("pickMask").classList.remove("on");};
function bindNum(inp,ei,si,key){
  inp.oninput=function(){
    var v=parseFloat(this.value);
    if(!isFinite(v))v=0;
    draft[ei].sets[si][key]=key==="r"?parseInt(this.value,10)||0:v;
    saveDraft();
    var vol=document.getElementById("vol-"+ei);
    if(vol)vol.textContent="종목 볼륨 "+volOf(draft[ei])+"kg";
  };
}
function paintToday(){
  var saved=daySaved();
  var home=$("homeBox"), sess=$("sessionBox"), sav=$("savedBox");
  home.innerHTML="";sess.innerHTML="";sav.innerHTML="";
  if(!draft.length && !saved){
    $("statusLine").textContent="오늘 세션이 없습니다. 운동을 시작하세요.";
    home.innerHTML="<div class='card'><p class='lead'>운동을 시작해 볼까요?</p><button class='blue' type='button' id='btnStart'>운동 시작하기</button></div>";
    $("btnStart").onclick=openPick;
    return;
  }
  if(!draft.length && saved){
    $("statusLine").textContent="오늘 기록이 저장되어 있습니다. 잘못 저장했으면 취소하거나 편집하세요.";
    sav.innerHTML="<div class='card'><p class='k'>오늘 저장됨</p><pre style='white-space:pre-wrap;margin:8px 0 0'>"+saved.note+"</pre></div><button class='primary' type='button' id='btnEdit'>저장 취소 · 편집</button><button class='ghost' type='button' id='btnAddMoreSaved'>운동 더 추가</button>";
    $("btnEdit").onclick=unsave;
    $("btnAddMoreSaved").onclick=function(){unsave();openPick();};
    return;
  }
  $("statusLine").textContent="세트마다 무게·횟수를 고치고 체크하세요. 저장하면 오늘 하루분으로 남습니다.";
  for(var ei=0;ei<draft.length;ei++){
    var it=draft[ei];
    var card=document.createElement("div");
    card.className="card";
    var head=document.createElement("div");
    head.className="exhead";
    var h2=document.createElement("h2");
    h2.textContent=(ei+1)+" "+it.name;
    var drop=document.createElement("button");
    drop.type="button";drop.className="mini";drop.textContent="종목 빼기";
    drop.onclick=(function(idx){return function(){draft.splice(idx,1);saveDraft();paintToday();};})(ei);
    head.appendChild(h2);head.appendChild(drop);card.appendChild(head);
    var vol=document.createElement("div");
    vol.className="vol";vol.id="vol-"+ei;vol.textContent="종목 볼륨 "+volOf(it)+"kg";
    card.appendChild(vol);
    var table=document.createElement("table");
    table.className="tbl";
    table.innerHTML="<tr><th>세트</th><th>kg</th><th>회</th><th>완료</th></tr>";
    var sets=it.sets||[];
    for(var si=0;si<sets.length;si++){
      var tr=document.createElement("tr");
      var td1=document.createElement("td");td1.textContent=String(si+1);
      var td2=document.createElement("td");
      var inw=document.createElement("input");inw.inputMode="decimal";inw.value=sets[si].w;bindNum(inw,ei,si,"w");
      td2.appendChild(inw);
      var td3=document.createElement("td");
      var inr=document.createElement("input");inr.inputMode="numeric";inr.value=sets[si].r;bindNum(inr,ei,si,"r");
      td3.appendChild(inr);
      var td4=document.createElement("td");
      var ck=document.createElement("button");
      ck.type="button";ck.className="done"+(sets[si].done?" on":"");ck.textContent=sets[si].done?"✓":"";
      ck.onclick=(function(e,s,btn){return function(){
        draft[e].sets[s].done=!draft[e].sets[s].done;
        btn.className="done"+(draft[e].sets[s].done?" on":"");
        btn.textContent=draft[e].sets[s].done?"✓":"";
        saveDraft();
      };})(ei,si,ck);
      td4.appendChild(ck);
      tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(td3);tr.appendChild(td4);
      table.appendChild(tr);
    }
    card.appendChild(table);
    var bar=document.createElement("div");
    bar.className="setbar";
    var delS=document.createElement("button");delS.type="button";delS.className="link";delS.textContent="— 세트삭제";
    delS.onclick=(function(idx){return function(){
      if(!draft[idx].sets.length)return;
      draft[idx].sets.pop();
      if(!draft[idx].sets.length)draft.splice(idx,1);
      saveDraft();paintToday();
    };})(ei);
    var addS=document.createElement("button");addS.type="button";addS.className="link";addS.textContent="+ 세트추가";
    addS.onclick=(function(idx){return function(){
      var last=draft[idx].sets[draft[idx].sets.length-1]||{w:20,r:10};
      draft[idx].sets.push({w:last.w,r:last.r,done:false});
      saveDraft();paintToday();
    };})(ei);
    bar.appendChild(delS);bar.appendChild(addS);card.appendChild(bar);
    sess.appendChild(card);
  }
  var actions=document.createElement("div");
  actions.innerHTML="<button class='ghost' type='button' id='btnAddEx'>+ 운동 추가</button><button class='blue' type='button' id='btnSave'>오늘 운동 끝 · 저장</button><p class='msg' id='todayMsg'></p>";
  sess.appendChild(actions);
  $("btnAddEx").onclick=openPick;
  $("btnSave").onclick=saveDay;
}
function saveDay(){
  if(!draft.length){$("statusLine").textContent="저장할 세트가 없습니다.";return;}
  var items=clone(draft);
  var list=load().filter(function(d){return d.date!==today();});
  list.unshift({date:today(),note:noteOf(items),items:items});
  saveAll(list.slice(0,60));
  safeDel(draftKey());
  draft=[];
  paintToday();
  paintAb();
}
function unsave(){
  var saved=daySaved();
  if(!saved)return;
  draft=clone(saved.items||[]);
  saveDraft();
  var list=load().filter(function(d){return d.date!==today();});
  saveAll(list);
  paintToday();
  paintAb();
  $("statusLine").textContent="저장을 취소했습니다. 숫자를 고치거나 운동을 더 넣으세요.";
}
function paintPickForm(){
  var box=$("exList");
  box.innerHTML="";
  for(var i=0;i<EX.length;i++){
    var b=document.createElement("button");
    b.type="button";
    b.className="exbtn"+(EX[i]===formPicked?" on":"");
    b.textContent=EX[i];
    b.onclick=(function(name){return function(){formPicked=name;$("formPicked").textContent="선택: "+name;paintPickForm();};})(EX[i]);
    box.appendChild(b);
  }
  $("formPicked").textContent="선택: "+formPicked;
}
var cal=new Date();
$("btnPrev").onclick=function(){cal.setMonth(cal.getMonth()-1);paintCal();};
$("btnNext").onclick=function(){cal.setMonth(cal.getMonth()+1);paintCal();};
function paintCal(){
  var y=cal.getFullYear(),m=cal.getMonth();
  $("calTitle").textContent=y+"년 "+(m+1)+"월";
  var start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  var h="";
  for(var i=0;i<start;i++)h+="<span></span>";
  for(var d=1;d<=days;d++){
    var iso=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var has=load().some(function(z){return z.date===iso;});
    h+="<button type='button' class='"+(has?"has":"")+"' data-iso='"+iso+"'>"+d+"</button>";
  }
  $("calGrid").innerHTML=h;
  var btns=$("calGrid").querySelectorAll("button");
  for(var i=0;i<btns.length;i++)btns[i].onclick=function(){
    var iso=this.getAttribute("data-iso");
    var x=null;var list=load();
    for(var k=0;k<list.length;k++)if(list[k].date===iso)x=list[k];
    $("calDetail").innerHTML=x?("<pre style='white-space:pre-wrap;margin:0'>"+x.note+"</pre>"+(iso===today()?"<button class='primary' type='button' id='btnCalEdit'>이 날 편집</button>":"")):( "<p class='lead'>"+iso+" 기록 없음</p>");
    var be=$("btnCalEdit");
    if(be)be.onclick=function(){unsave();go("today");};
  };
}
function paintAb(){
  var list=load(),v=0,pr={};
  list.forEach(function(d){(d.items||[]).forEach(function(it){(it.sets||[]).forEach(function(s){
    v+=(Number(s.w)||0)*(Number(s.r)||0);
    if((Number(s.w)||0)>(pr[it.name]||0))pr[it.name]=Number(s.w);
  });});});
  $("abVol").textContent=String(Math.round(v));
  $("abPr").textContent=String(Object.keys(pr).length);
  var keys=Object.keys(pr);
  $("rmBox").innerHTML=keys.length?keys.map(function(k){return "<div style='display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222'><span>"+k+"</span><span>"+pr[k]+"kg</span></div>";}).join(""):"<p class='lead'>오늘 세션을 저장하면 여기 나옵니다.</p>";
}
var hasFile=false;
$("file").onchange=function(){
  hasFile=!!(this.files&&this.files[0]);
  $("fileMeta").textContent=hasFile?this.files[0].name:"파일을 고르세요";
};
$("btnReport").onclick=function(){
  if(!hasFile){$("fileMeta").textContent="사진이나 영상을 고르세요.";return;}
  var box=$("reportBox");
  box.style.display="block";
