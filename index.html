<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b0b"/>
<title>리프트노트</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0b0b;color:#f2efe8;font-family:sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100dvh}
.screen{display:none;padding:18px 18px 84px}.screen.on{display:block}
.logo{font-size:28px;margin:0}.logo small{display:block;font-size:11px;color:#8d8a84;letter-spacing:.28em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:16px 0}
.week span{text-align:center;font-size:11px;color:#8d8a84}
.week button{border:0;background:0;color:#fff;border-radius:12px;padding:8px 0}
.week button.on{background:#2a2a2a}
.row{display:flex;justify-content:space-between;align-items:flex-end}
h1{font-size:24px;margin:4px 0 12px}h2{font-size:18px;margin:0 0 8px}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:22px;padding:18px;margin-top:12px}
.lead,.k{color:#8d8a84;font-size:13px}
.primary,.ghost{width:100%;border:0;border-radius:14px;padding:14px;margin-top:10px;color:#efe8dc}
.primary{background:#3a342c}.ghost{background:#1a1a1a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#0b0b0b;border-top:1px solid #222;display:flex}
.nav button{flex:1;background:0;border:0;color:#6f6c66;padding:12px 0;font-size:11px}
.nav button.on{color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.exbtn{border:1px solid #2a2a2a;background:#1a1a1a;color:#fff;border-radius:12px;padding:10px 12px}
.exbtn.on{background:#3a342c;border-color:#5a5044}
.msg{color:#8d8a84;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal button{border:0;background:#1a1a1a;color:#fff;border-radius:8px;padding:10px 0}
.statrow{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:#141414;border:1px solid #2a2a2a;border-radius:14px;padding:12px;text-align:center}
.num{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;padding:12px;text-align:center}
.line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #222}
.line button{background:0;border:0;color:#8d8a84;padding:4px}
</style>
</head>
<body>
<div class="app">
<section id="s-today" class="screen on">
<p class="logo">리프트노트<small>LIFTNOTE</small></p>
<div class="week" id="weekBar"></div>
<div class="k">오늘</div>
<h1 id="todayTitle">날짜</h1>
<div class="card">
<div class="k">1. 종목</div>
<h2 id="pickedName">운동을 고르세요</h2>
<div id="exPick" class="grid"></div>
</div>
<div class="card">
<div class="k">2. 이 세트 기록</div>
<div class="row3">
<div><div class="k">무게 kg</div><input id="kg" class="num" inputmode="decimal" placeholder="80"></div>
<div><div class="k">횟수</div><input id="reps" class="num" inputmode="numeric" placeholder="8"></div>
<div><div class="k">세트</div><input id="setsN" class="num" inputmode="numeric" placeholder="1" value="1"></div>
</div>
<button class="primary" type="button" id="btnAdd">이 세트 추가</button>
<p class="msg" id="addMsg"></p>
</div>
<div class="card">
<div class="k">3. 오늘 한 것</div>
<div id="todayList"><p class="lead">아직 없습니다.</p></div>
<button class="primary" type="button" id="btnSave">오늘 운동 끝 · 저장</button>
<p class="msg" id="todayMsg"></p>
</div>
</section>
<section id="s-cal" class="screen">
<p class="logo">달력</p>
<div class="row2"><button class="ghost" type="button" id="btnPrev">이전</button>
<button class="ghost" type="button" id="btnNext">다음</button></div>
<h1 id="calTitle"></h1>
<div class="cal" id="calGrid"></div>
<div class="card" id="calDetail"></div>
</section>
<section id="s-ability" class="screen">
<p class="logo">능력</p>
<p class="lead">자세 점수 없음. 볼륨만.</p>
<div class="statrow">
<div class="stat"><b id="abVol">0</b><span class="k">볼륨</span></div>
<div class="stat"><b id="abPr">0</b><span class="k">PR</span></div>
</div>
<div class="card" id="rmBox"></div>
</section>
<section id="s-form" class="screen">
<p class="logo">자세</p>
<p class="lead">종목 고르고 사진·영상. 연습 리포트.</p>
<div class="card"><p id="formPicked">운동을 고르세요</p><div id="exList" class="grid"></div></div>
<label class="card">사진/영상<input id="file" type="file" accept="image/*,video/*"></label>
<p class="msg" id="fileMeta"></p>
<button class="primary" type="button" id="btnReport">연습 리포트</button>
<div class="card" id="reportBox" style="display:none"></div>
</section>
<section id="s-settings" class="screen">
<p class="logo">설정</p>
<div class="card"><p class="lead">일기 공짜. 자세는 연습. KEEP By soon young.</p>
<button class="ghost" type="button" id="btnClear">기록 지우기</button></div>
</section>
<nav class="nav">
<button type="button" data-go="today" class="on">오늘</button>
<button type="button" data-go="cal">달력</button>
<button type="button" data-go="ability">능력</button>
<button type="button" data-go="form">자세</button>
<button type="button" data-go="settings">설정</button>
</nav>
</div>
<script>
const EX=["바벨 벤치프레스","인클라인 벤치프레스","랫풀다운","바벨 로우","밀리터리 프레스","레터럴 레이즈","바벨 컬","리버스 바벨 컬","스쿼트","데드리프트"];
function $(i){return document.getElementById(i)}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function load(){try{return JSON.parse(localStorage.getItem("ln_diary")||"[]")}catch(e){return[]}}
function saveAll(a){localStorage.setItem("ln_diary",JSON.stringify(a))}
function draftKey(){return "ln_draft_"+today()}
function loadDraft(){try{return JSON.parse(localStorage.getItem(draftKey())||"[]")}catch(e){return[]}}
function saveDraft(a){localStorage.setItem(draftKey(),JSON.stringify(a))}
let picked=EX[0];
let draft=loadDraft();
function go(n){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $("s-"+n).classList.add("on");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===n));
  if(n==="cal")paintCal();
  if(n==="ability")paintAb();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));
(function(){
  const d=["일","월","화","수","목","금","토"],n=new Date(),s=new Date(n);
  s.setDate(n.getDate()-n.getDay());
  let h="";
  for(let i=0;i<7;i++)h+="<span>"+d[i]+"</span>";
  for(let i=0;i<7;i++){
    const x=new Date(s);x.setDate(s.getDate()+i);
    h+="<button type=button class='"+(x.toDateString()===n.toDateString()?"on":"")+"'>"+x.getDate()+"</button>";
  }
  $("weekBar").innerHTML=h;
  $("todayTitle").textContent=(n.getMonth()+1)+"월 "+n.getDate()+"일 "+d[n.getDay()]+"요일";
})();
function paintEx(boxId, onPick){
  $(boxId).innerHTML=EX.map(n=>"<button class='exbtn"+(n===picked?" on":"")+"' type=button>"+n+"</button>").join("");
  $(boxId).querySelectorAll("button").forEach(b=>b.onclick=()=>{
    picked=b.textContent;
    onPick();
    paintEx("exPick", syncPick);
    paintEx("exList", ()=>{$("formPicked").textContent="선택: "+picked;});
  });
}
function syncPick(){
  $("pickedName").textContent=picked;
  $("formPicked").textContent="선택: "+picked;
  $("addMsg").textContent="";
}
paintEx("exPick", syncPick);
paintEx("exList", ()=>{$("formPicked").textContent="선택: "+picked;});
syncPick();
function lineText(it){
  const sets=(it.sets||[]).map(s=>s.w+"kg × "+s.r+"회").join(", ");
  return it.name+" · "+(sets||"세트 없음");
}
function paintToday(){
  if(!draft.length){$("todayList").innerHTML="<p class='lead'>아직 없습니다. 종목 고르고 세트를 추가하세요.</p>";return;}
  $("todayList").innerHTML=draft.map((it,i)=>"<div class='line'><span>"+lineText(it)+"</span><button type=button data-i='"+i+"'>빼기</button></div>").join("");
  $("todayList").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    draft.splice(+b.dataset.i,1);saveDraft(draft);paintToday();
  });
}
paintToday();
$("btnAdd").onclick=function(){
  const w=parseFloat($("kg").value);
  const r=parseInt($("reps").value,10);
  const n=Math.max(1,parseInt($("setsN").value,10)||1);
  if(!picked){$("addMsg").textContent="종목을 먼저 고르세요.";return;}
  if(!w||!r){$("addMsg").textContent="무게와 횟수를 적으세요.";return;}
  let row=draft.find(x=>x.name===picked);
  if(!row){row={name:picked,sets:[]};draft.push(row);}
  for(let i=0;i<n;i++)row.sets.push({w:w,r:r});
  saveDraft(draft);
  $("addMsg").textContent=picked+" "+w+"kg × "+r+"회 "+n+"세트 넣었습니다.";
  paintToday();
};
$("btnSave").onclick=function(){
  if(!draft.length){$("todayMsg").textContent="오늘 한 세트가 없습니다.";return;}
  const note=draft.map(lineText).join("\n");
  const list=load().filter(d=>d.date!==today());
  list.unshift({date:today(),note:note,items:draft});
  saveAll(list.slice(0,60));
  localStorage.removeItem(draftKey());
  draft=[];
  paintToday();
  $("todayMsg").textContent="오늘 운동 저장했습니다.";
  paintAb();
};
let cal=new Date();
$("btnPrev").onclick=()=>{cal.setMonth(cal.getMonth()-1);paintCal();};
$("btnNext").onclick=()=>{cal.setMonth(cal.getMonth()+1);paintCal();};
function paintCal(){
  const y=cal.getFullYear(),m=cal.getMonth();
  $("calTitle").textContent=y+"년 "+(m+1)+"월";
  const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let h="";
  for(let i=0;i<start;i++)h+="<span></span>";
  for(let d=1;d<=days;d++){
    const iso=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    h+="<button type=button data-iso='"+iso+"'>"+d+"</button>";
  }
  $("calGrid").innerHTML=h;
  $("calGrid").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const x=load().find(z=>z.date===b.dataset.iso);
    $("calDetail").textContent=x?x.note:(b.dataset.iso+" 기록 없음");
  });
}
function paintAb(){
  const list=load();
  let v=0,n=0;
  list.forEach(d=>(d.items||[]).forEach(it=>(it.sets||[]).forEach(s=>{v+=(s.w||0)*(s.r||0);if(s.w)n++;})));
  $("abVol").textContent=String(Math.round(v));
  $("abPr").textContent=String(n);
  $("rmBox").textContent=n?"저장된 기록이 있습니다.":"오늘 운동을 저장하면 여기 나옵니다.";
}
let has=false;
$("file").onchange=function(e){
  has=!!(e.target.files&&e.target.files[0]);
  $("fileMeta").textContent=has?e.target.files[0].name:"파일을 고르세요";
};
$("btnReport").onclick=function(){
  if(!has){$("fileMeta").textContent="사진이나 영상을 고르세요.";return;}
  const box=$("reportBox");
  box.style.display="block";
  box.innerHTML="<b>"+picked+"</b><p class='lead'>준비: 주동근 켤 뒤에 움직입니다.</p><p>잘한 점: 종목을 고르고 영상을 올렸습니다.</p><p>개선: 내릴 때 맨 아래에서 하나 하고 올라오세요.</p><p class='lead'>연습 리포트. 점수 없음.</p>";
};
$("btnClear").onclick=function(){
  if(confirm("기록을 지운까요?")){
    localStorage.removeItem("ln_diary");
    localStorage.removeItem(draftKey());
    draft=[];
    paintToday();
    $("todayMsg").textContent="지웠습니다.";
    paintAb();
  }
};
paintAb();
</script>
</body>
</html>
