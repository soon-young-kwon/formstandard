<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b0b"/>
<title>리프트노트</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0b0b;color:#f2efe8;font-family:sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100dvh}
.screen{display:none;padding:18px 18px 96px}.screen.on{display:block}
.logo{font-size:28px;margin:0}.logo small{display:block;font-size:11px;color:#8d8a84;letter-spacing:.28em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:16px 0}
.week span{text-align:center;font-size:11px;color:#8d8a84}
.week button{border:0;background:0;color:#fff;border-radius:12px;padding:8px 0}
.week button.on{background:#2a2a2a}
h1{font-size:24px;margin:4px 0 12px}h2{font-size:17px;margin:0}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:22px;padding:16px;margin-top:12px}
.lead,.k{color:#8d8a84;font-size:13px}
.primary,.ghost,.mini{border:0;border-radius:14px;padding:12px;color:#efe8dc}
.primary,.ghost{width:100%;margin-top:10px}
.primary{background:#3a342c}.ghost{background:#1a1a1a}
.mini{background:#1a1a1a;padding:8px 10px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#0b0b0b;border-top:1px solid #222;display:flex;z-index:5}
.nav button{flex:1;background:0;border:0;color:#6f6c66;padding:12px 0;font-size:11px}
.nav button.on{color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.exbtn{border:1px solid #2a2a2a;background:#1a1a1a;color:#fff;border-radius:12px;padding:10px 12px}
.exbtn.on{background:#3a342c;border-color:#5a5044}
.msg{color:#8d8a84;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal button{border:0;background:#1a1a1a;color:#fff;border-radius:8px;padding:10px 0}
.cal button.has{outline:1px solid #5a5044}
.statrow{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:#141414;border:1px solid #2a2a2a;border-radius:14px;padding:12px;text-align:center}
.num{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;padding:12px;text-align:center}
.setline{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #222;gap:8px}
.setline button{background:0;border:0;color:#8d8a84;padding:4px;flex:none}
.hint{font-size:12px;color:#8d8a84;margin:6px 0 0}
.exhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.hidden{display:none!important}
.sheet{margin-top:10px}
</style>
</head>
<body>
<div class="app">
<section id="s-today" class="screen on">
<p class="logo">리프트노트<small>LIFTNOTE</small></p>
<div class="week" id="weekBar"></div>
<div class="k">오늘 세션</div>
<h1 id="todayTitle">날짜</h1>
<p class="lead" id="sessHint">종목을 추가하고 세트를 한 줄씩 넣으세요. 여러 운동을 한 세션에 저장합니다.</p>
<div id="sessionBox"></div>
<div class="card">
<button class="ghost" type="button" id="btnShowAdd">+ 운동 추가</button>
<div id="addSheet" class="sheet hidden">
<div class="k">종목</div>
<div id="exPick" class="grid"></div>
<p class="hint" id="lastHint"></p>
<div class="row3" style="margin-top:10px">
<div><div class="k">무게 kg</div><input id="kg" class="num" inputmode="decimal" value="80"></div>
<div><div class="k">횟수</div><input id="reps" class="num" inputmode="numeric" value="8"></div>
<div><div class="k">몇 세트</div><input id="setsN" class="num" inputmode="numeric" value="1"></div>
</div>
<button class="primary" type="button" id="btnAdd">이 세트 추가</button>
<p class="msg" id="addMsg"></p>
</div>
</div>
<button class="primary" type="button" id="btnSave">오늘 운동 끝 · 저장</button>
<p class="msg" id="todayMsg"></p>
</section>
<section id="s-cal" class="screen">
<p class="logo">달력</p>
<div class="row2"><button class="ghost" type="button" id="btnPrev">이전</button>
<button class="ghost" type="button" id="btnNext">다음</button></div>
<h1 id="calTitle"></h1>
<div class="cal" id="calGrid"></div>
<div class="card" id="calDetail"><p class="lead">날짜를 누르면 그날 세션이 나옵니다.</p></div>
</section>
<section id="s-ability" class="screen">
<p class="logo">능력</p>
<p class="lead">자세 점수 없음. 볼륨·PR만.</p>
<div class="statrow">
<div class="stat"><b id="abVol">0</b><div class="k">볼륨</div></div>
<div class="stat"><b id="abPr">0</b><div class="k">PR</div></div>
</div>
<div class="card" id="rmBox"></div>
</section>
<section id="s-form" class="screen">
<p class="logo">자세</p>
<p class="lead">종목 고르고 사진·영상. 연습 리포트. 점수 없음.</p>
<div class="card"><p id="formPicked">운동을 고르세요</p><div id="exList" class="grid"></div></div>
<label class="card">사진/영상<input id="file" type="file" accept="image/*,video/*"></label>
<p class="msg" id="fileMeta"></p>
<button class="primary" type="button" id="btnReport">연습 리포트</button>
<div class="card hidden" id="reportBox"></div>
</section>
<section id="s-settings" class="screen">
<p class="logo">설정</p>
<div class="card"><p class="lead">일기 공짜. 자세는 연습. KEEP By soon young.</p>
<button class="ghost" type="button" id="btnClear">기록 지우기</button></div>
</section>
<nav class="nav">
<button type="button" data-go="today" class="on">오늘</button>
<button type="button" data-go="cal">달력</button>
<button type="button" data-go="ability">능력</button>
<button type="button" data-go="form">자세</button>
<button type="button" data-go="settings">설정</button>
</nav>
</div>
<script>
const EX=["바벨 벤치프레스","인클라인 벤치프레스","랫풀다운","바벨 로우","밀리터리 프레스","레터럴 레이즈","바벨 컬","리버스 바벨 컬","스쿼트","데드리프트"];
function $(i){return document.getElementById(i)}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function load(){try{return JSON.parse(localStorage.getItem("ln_diary")||"[]")}catch(e){return[]}}
function saveAll(a){localStorage.setItem("ln_diary",JSON.stringify(a))}
function draftKey(){return "ln_draft_"+today()}
function loadDraft(){try{return JSON.parse(localStorage.getItem(draftKey())||"[]")}catch(e){return[]}}
function saveDraft(a){localStorage.setItem(draftKey(),JSON.stringify(a))}
let formPicked=EX[0];
let addPicked=EX[0];
let draft=loadDraft();
function go(n){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $("s-"+n).classList.add("on");
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===n));
  if(n==="today"){draft=loadDraft();paintToday();}
  if(n==="cal")paintCal();
  if(n==="ability")paintAb();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));
(function(){
  const d=["일","월","화","수","목","금","토"],n=new Date(),s=new Date(n);
  s.setDate(n.getDate()-n.getDay());
  let h="";
  for(let i=0;i<7;i++)h+="<span>"+d[i]+"</span>";
  for(let i=0;i<7;i++){
    const x=new Date(s);x.setDate(s.getDate()+i);
    h+="<button type=button class='"+(x.toDateString()===n.toDateString()?"on":"")+"'>"+x.getDate()+"</button>";
  }
  $("weekBar").innerHTML=h;
  $("todayTitle").textContent=(n.getMonth()+1)+"월 "+n.getDate()+"일 "+d[n.getDay()]+"요일";
})();
function lastOf(name){
  const list=load();
  for(let i=0;i<list.length;i++){
    const it=(list[i].items||[]).find(x=>x.name===name);
    if(it&&it.sets&&it.sets.length)return it.sets[it.sets.length-1];
  }
  const cur=draft.find(x=>x.name===name);
  if(cur&&cur.sets&&cur.sets.length)return cur.sets[cur.sets.length-1];
  return null;
}
function paintPick(boxId, current, onPick){
  $(boxId).innerHTML=EX.map(n=>"<button class='exbtn"+(n===current?" on":"")+"' type=button>"+n+"</button>").join("");
  $(boxId).querySelectorAll("button").forEach(b=>b.onclick=()=>onPick(b.textContent));
}
function showLast(name){
  const last=lastOf(name);
  $("lastHint").textContent=last?("지난번: "+last.w+"kg × "+last.r+"회"):"이 종목 첫 기록";
  if(last){
    if(!$("kg").value)$("kg").value=last.w;
    if(!$("reps").value)$("reps").value=last.r;
  }
}
function paintFormEx(){
  paintPick("exList", formPicked, n=>{
    formPicked=n;
    $("formPicked").textContent="선택: "+formPicked;
    paintFormEx();
  });
  $("formPicked").textContent="선택: "+formPicked;
}
function paintAddEx(){
  paintPick("exPick", addPicked, n=>{
    addPicked=n;
    showLast(n);
    paintAddEx();
    $("addMsg").textContent="";
  });
}
function lineText(it){
  const sets=(it.sets||[]).map(s=>s.w+"kg × "+s.r+"회").join(", ");
  return it.name+" · "+(sets||"세트 없음");
}
function paintToday(){
  if(!draft.length){
    $("sessionBox").innerHTML="<div class='card'><p class='lead'>아직 없습니다. 아래 + 운동 추가로 종목을 넣으세요.</p></div>";
    return;
  }
  $("sessionBox").innerHTML=draft.map((it,ei)=>{
    const sets=(it.sets||[]).map((s,si)=>"<div class='setline'><span>"+(si+1)+". "+s.w+"kg × "+s.r+"회</span><button type=button data-e='"+ei+"' data-s='"+si+"'>빼기</button></div>").join("");
    return "<div class='card'><div class='exhead'><h2>"+it.name+"</h2><button class='mini' type=button data-drop='"+ei+"'>종목 빼기</button></div>"+
      (sets||"<p class='lead'>세트 없음</p>")+
      "<button class='ghost' type=button data-more='"+ei+"'>+ 세트 추가</button></div>";
  }).join("");
  $("sessionBox").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    const e=+b.dataset.e,s=+b.dataset.s;
    draft[e].sets.splice(s,1);
    if(!draft[e].sets.length)draft.splice(e,1);
    saveDraft(draft);paintToday();
  });
  $("sessionBox").querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{
    draft.splice(+b.dataset.drop,1);saveDraft(draft);paintToday();
  });
  $("sessionBox").querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{
    const row=draft[+b.dataset.more];
    addPicked=row.name;
    const last=(row.sets&&row.sets[row.sets.length-1])||lastOf(row.name)||{w:parseFloat($("kg").value)||80,r:parseInt($("reps").value,10)||8};
    row.sets.push({w:last.w,r:last.r});
    saveDraft(draft);
    paintToday();
    $("addMsg").textContent=row.name+" "+last.w+"kg × "+last.r+"회 한 줄 더 넣었습니다.";
  });
}
paintToday();
paintAddEx();
paintFormEx();
showLast(addPicked);
$("btnShowAdd").onclick=function(){
  $("addSheet").classList.toggle("hidden");
  paintAddEx();showLast(addPicked);
};
$("btnAdd").onclick=function(){
  const w=parseFloat($("kg").value);
  const r=parseInt($("reps").value,10);
  const n=Math.max(1,parseInt($("setsN").value,10)||1);
  if(!addPicked){$("addMsg").textContent="종목을 먼저 고르세요.";return;}
  if(!isFinite(w)||w<=0||!isFinite(r)||r<=0){$("addMsg").textContent="무게와 횟수를 숫자로 적으세요.";return;}
  let row=draft.find(x=>x.name===addPicked);
  if(!row){row={name:addPicked,sets:[]};draft.push(row);}
  for(let i=0;i<n;i++)row.sets.push({w:w,r:r});
  saveDraft(draft);
  $("addMsg").textContent=addPicked+" "+w+"kg × "+r+"회 "+n+"줄 넣었습니다.";
  paintToday();
};
$("btnSave").onclick=function(){
  if(!draft.length){$("todayMsg").textContent="오늘 한 세트가 없습니다.";return;}
  const note=draft.map(lineText).join("\n");
  const list=load().filter(d=>d.date!==today());
  list.unshift({date:today(),note:note,items:JSON.parse(JSON.stringify(draft))});
  saveAll(list.slice(0,60));
  localStorage.removeItem(draftKey());
  draft=[];
  paintToday();
  $("todayMsg").textContent="오늘 세션을 저장했습니다. 달력·능력에서 확인하세요.";
  paintAb();
};
let cal=new Date();
$("btnPrev").onclick=()=>{cal.setMonth(cal.getMonth()-1);paintCal();};
$("btnNext").onclick=()=>{cal.setMonth(cal.getMonth()+1);paintCal();};
function paintCal(){
  const y=cal.getFullYear(),m=cal.getMonth();
  $("calTitle").textContent=y+"년 "+(m+1)+"월";
  const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let h="";
  for(let i=0;i<start;i++)h+="<span></span>";
  for(let d=1;d<=days;d++){
    const iso=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const has=load().some(z=>z.date===iso);
    h+="<button type=button class='"+(has?"has":"")+"' data-iso='"+iso+"'>"+d+"</button>";
  }
  $("calGrid").innerHTML=h;
  $("calGrid").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const x=load().find(z=>z.date===b.dataset.iso);
    $("calDetail").innerHTML=x?("<pre style='white-space:pre-wrap;margin:0'>"+x.note+"</pre>"):("<p class='lead'>"+b.dataset.iso+" 기록 없음</p>");
  });
}
function paintAb(){
  const list=load();
  let v=0,best=0;
  const pr={};
  list.forEach(d=>(d.items||[]).forEach(it=>(it.sets||[]).forEach(s=>{
    v+=(s.w||0)*(s.r||0);
    const k=it.name;
    if((s.w||0)>(pr[k]||0))pr[k]=s.w;
  })));
  best=Object.keys(pr).length;
  $("abVol").textContent=String(Math.round(v));
  $("abPr").textContent=String(best);
  $("rmBox").innerHTML=best?Object.keys(pr).map(k=>"<div class='setline'><span>"+k+"</span><span>"+pr[k]+"kg</span></div>").join(""):"<p class='lead'>오늘 세션을 저장하면 여기 나옵니다.</p>";
}
let hasFile=false;
$("file").onchange=function(e){
  e.stopPropagation();
  hasFile=!!(e.target.files&&e.target.files[0]);
  $("fileMeta").textContent=hasFile?e.target.files[0].name:"파일을 고르세요";
};
$("file").onclick=function(e){e.stopPropagation();};
$("btnReport").onclick=function(){
  if(!hasFile){$("fileMeta").textContent="사진이나 영상을 고르세요.";return;}
  const box=$("reportBox");
  box.classList.remove("hidden");
  box.innerHTML="<b>"+formPicked+"</b>"+
    "<p class='k'>준비자세</p><p>쓰려는 근육을 먼저 켠 뒤에 움직입니다.</p>"+
    "<p class='k'>잘한 점</p><p>종목을 고르고 영상을 올렸습니다. 연습 화면이라 관절은 아직 보지 않습니다.</p>"+
    "<p class='k'>단점</p><p>실제 분석 서버가 없어 영상 속 동작은 판단하지 못합니다.</p>"+
    "<p class='k'>개선</p><p>다음엔 옆에서, 배 높이로 전신이 나오게 찍어 주세요. 화면 밖 관절은 만들지 않습니다.</p>"+
    "<p class='k'>다음 촬영 각도</p><p>옆, 배 높이</p>"+
    "<p class='lead'>연습 리포트. 점수 없음.</p>";
};
$("btnClear").onclick=function(){
  if(confirm("기록을 지울까요?")){
    localStorage.removeItem("ln_diary");
    localStorage.removeItem(draftKey());
    draft=[];
    paintToday();
    $("todayMsg").textContent="지웠습니다.";
    paintAb();
  }
};
paintAb();
</script>
</body>
</html>
